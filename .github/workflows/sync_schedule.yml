name: Sync Course Schedule Data

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  
  workflow_dispatch: 

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser with system dependencies
        run: playwright install --with-deps chromium

      - name: Run scripts/upload_data.py --schedule
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/upload_data.py --schedule
