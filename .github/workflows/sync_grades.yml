name: Sync grades
on:
    schedule:
        - cron: '0 3 * * 0'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: qcs-data-sync
    cancel-in-progress: false
jobs:
    sync:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
            - run: pip install -r requirements.txt
            - run: python -B -m unittest discover -s scripts/tests -q
            - run: python -u -m scripts.sync_grades --commit
              env:
                  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
