name: Sync Instructor Grades and Summaries

on:
  schedule:
    # Runs weekly every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  
  workflow_dispatch: 

jobs:
  update-instructor-grades:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy sqlalchemy requests python-dotenv openpyxl psycopg2-binary

      - name: Run scripts/upload_data.py --grades
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/upload_data.py --grades
