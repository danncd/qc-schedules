name: Test scripts
on:
    push:
        paths: ['scripts/**', 'requirements.txt', '.github/workflows/**']
    pull_request:
        paths: ['scripts/**', 'requirements.txt', '.github/workflows/**']
    workflow_dispatch:
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: qcs_test
                    POSTGRES_USER: qcs_test
                    POSTGRES_PASSWORD: qcs_test
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
            - run: pip install -r requirements.txt
            - run: python -B -m unittest discover -s scripts/tests -v
              env:
                  QCS_TEST_DATABASE_URL: postgresql+psycopg2://qcs_test:qcs_test@127.0.0.1:5432/qcs_test
